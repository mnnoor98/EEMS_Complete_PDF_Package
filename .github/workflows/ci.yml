name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore backend/EEMS.sln
      - run: dotnet test backend/EEMS.sln -c Release --no-restore
      - run: dotnet publish backend/src/EEMS.Api/EEMS.Api.csproj -c Release --no-restore -o artifacts/api
      - uses: actions/upload-artifact@v4
        with: { name: api, path: artifacts/api }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: frontend/dist/eems/browser }
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t eems-api:ci backend
      - run: docker build -t eems-web:ci frontend
      - run: POSTGRES_PASSWORD=ci-database-password JWT_SIGNING_KEY=ci-only-signing-key-with-32-characters ADMIN_PASSWORD=ci-admin-password docker compose -f compose.yaml config --quiet
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
